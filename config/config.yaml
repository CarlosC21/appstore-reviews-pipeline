paths:
  raw_base: data/raw
  staging_dir: data/staging
  metadata_dir: data/metadata
  log_dir: logs
  processed_base: data/processed
  run_records_dir: data/processing_runs
  catalog_dir: data/catalog

transform:
  google_app_name: "Google Play App Reviews Dataset"
  partition_columns: [platform, review_year]

settings:
  checksum_algorithm: sha256
  log_level: INFO

datasets:
  - name: google_reviews
    kaggle_id: hassaanmustafavi/google-play-app-reviews-dataset
  - name: ios_dataset
    kaggle_id: crawlfeeds/app-store-reviews-dataset
